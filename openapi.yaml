# KERANGKA kontrak API. B melengkapi skema request/response di minggu 1; C memakainya untuk mock.
# Aturan: item milik orang lain dijawab 404 (bukan 403) agar ID tidak bisa dienumerasi.
openapi: 3.0.3
info:
  title: KlinikKu API
  version: 0.0.1
paths:
  /auth/register:
    post:
      summary: Daftar akun baru
      description: TODO (B2). Siapkan material kunci pengguna di sini.
      responses: {"201": {description: TODO}}
  /auth/login:
    post:
      summary: Login; membuka kunci pengguna di sesi server
      description: TODO (B2). Rate limit dan lockout. Pesan error sama untuk email salah dan password salah.
      responses: {"200": {description: TODO}, "401": {description: TODO}, "429": {description: TODO}}
  /auth/logout:
    post:
      summary: Akhiri sesi dan hapus kunci dari memori
      responses: {"204": {description: TODO}}
  /profile:
    get:
      summary: Ambil data pribadi sendiri (query algo=aes|des|rc4)
      responses: {"200": {description: TODO}}
    put:
      summary: Simpan data pribadi (dienkripsi 3 salinan)
      responses: {"200": {description: TODO}}
  /items:
    get:
      summary: Daftar metadata item milik sendiri
      responses: {"200": {description: TODO}}
    post:
      summary: Unggah item (multipart; kind = id_scan | document | video)
      description: TODO (B5). Respons berisi id item dan info tiap salinan.
      responses: {"201": {description: TODO}}
  /items/{id}:
    get:
      summary: Unduh item, didekripsi (query algo=aes|des|rc4; mendukung HTTP Range untuk video)
      responses: {"200": {description: TODO}, "404": {description: TODO}}
    delete:
      summary: Hapus item beserta ketiga salinannya
      responses: {"204": {description: TODO}}
  /items/{id}/verify:
    get:
      summary: Dekripsi ketiga salinan dan bandingkan hash plaintext
      responses: {"200": {description: TODO}}
  /audit:
    get:
      summary: Log akses milik sendiri
      responses: {"200": {description: TODO}}
